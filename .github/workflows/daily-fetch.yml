name: Daily Feed Fetch

on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  fetch:
    if: github.event.schedule == '30 1 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch News (Category A)
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_APP_URL }}/api/fetch-news" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"

      - name: Fetch Blogs (Category B)
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_APP_URL }}/api/fetch-blogs" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"

  notify:
    if: github.event.schedule == '30 5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Send Push Notification
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_APP_URL }}/api/notify" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
