name: Daily Feed Fetch

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch News (Category A)
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_APP_URL }}/api/fetch-news" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"

      - name: Fetch Blogs (Category B)
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_APP_URL }}/api/fetch-blogs" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
